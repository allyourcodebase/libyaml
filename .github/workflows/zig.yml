name: Zig Build
on:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
          ubuntu-latest,
          windows-latest,
          macos-latest,
        ]
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup Zig
      uses: mlugg/setup-zig@v1
      with:
        version: master

    - name: Build
      run: zig build
